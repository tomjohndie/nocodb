name: Sync NocoDB Image

on:
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 登录到你的 GitHub 容器注册表 (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 开启实验性功能（确保多架构镜像如 amd64/arm64 能够完整复制）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 纯粹通过 Docker 搬运官方生产镜像，绝不运行任何 pnpm 源码命令
      - name: Pull and Push NocoDB Production Image
        run: |
          # 强制拉取官方已经打包好的【生产环境】镜像
          docker pull nocodb/nocodb:latest
          
          # 将你的 GitHub 用户名和仓库名自动转换为小写（GitHub 规定镜像路径必须全小写）
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          # 重新打上你自己的 GitHub 标签并推上去
          docker tag nocodb/nocodb:latest ghcr.io/$OWNER/$REPO/nocodb:latest
          docker push ghcr.io/$OWNER/$REPO/nocodb:latest
